{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мои задачи{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'todo/css/style.css' %}">
</head>
<body>
    <header>
        <div class="container">
            <a href="{% url 'task_list' %}" class="logo">✓ Мои задачи</a>
            <a href="{% url 'task_create' %}" class="btn btn-outline btn-sm">+ Новая задача</a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Todo App · Django</p>
    </footer>
</body>
</html>
