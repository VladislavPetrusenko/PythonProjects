{% extends 'blog/base.html' %}

{% block title %}Удаление поста{% endblock %}

{% block content %}
    <div class="delete-card">
        <h2>⚠️ Вы уверены?</h2>
        <p>Вы собираетесь удалить пост «<strong>{{ post.title }}</strong>». Это действие невозможно отменить.</p>
        <form method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">🗑️ Да, удалить</button>
        </form>
        <a href="{% url 'post_list' %}" class="btn btn-secondary ms-2">Отмена</a>
    </div>
{% endblock %}
