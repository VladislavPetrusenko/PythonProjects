{% extends 'blog/base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <article>
        <h1>{{ post.title }}</h1>
        <div class="article-meta">
            <span>📅 {{ post.created_at|date:"d.m.Y H:i" }}</span>
            <span>📌
                <span class="badge {% if post.status == 'published' %}badge-published{% else %}badge-draft{% endif %}">
                    {{ post.get_status_display }}
                </span>
            </span>
        </div>
        <hr>
        <div class="content">{{ post.content }}</div>
    </article>

    <div class="mt-4 d-flex flex-wrap gap-2">
        <a href="{% url 'post_update' post.pk %}" class="btn btn-outline-primary btn-action">✏️ Редактировать</a>
        <a href="{% url 'post_delete' post.pk %}" class="btn btn-outline-danger btn-action">🗑️ Удалить</a>
        <a href="{% url 'post_list' %}" class="btn btn-secondary btn-action">← Назад к списку</a>
    </div>
{% endblock %}
